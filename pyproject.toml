[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garbage-classifier"
version = "1.0.0"
description = "10-class household-waste image classifier: RegNetY-1.6GF transfer learning in PyTorch, with a leakage-free evaluation protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avaz Huseynov", email = "evezhuseynov24@gmail.com" }]
keywords = ["pytorch", "image-classification", "transfer-learning", "regnet", "waste-classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "torchinfo>=1.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "ImageHash>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tensorboard>=2.17",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
notebook = ["jupyterlab>=4.0", "ipywidgets>=8.1"]

[project.urls]
Homepage = "https://github.com/evez12/Garbage-Classifier"
Demo = "https://evez12.github.io/Garbage-Classifier/"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["garbage_dataset"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
